AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pipeline CI/CD (CodePipeline + CodeBuild) pour todolist-api.
  Source: GitHub (via CodeStar Connection). Stages: Source -> Deploy Dev ->
  Approbation manuelle -> Deploy Prod.

Parameters:
  GitHubOwner:
    Type: String
    Default: langston8182
  GitHubRepo:
    Type: String
    Default: todolist-api
  GitHubBranch:
    Type: String
    Default: main
  CodeStarConnectionArn:
    Type: String
    Description: >
      ARN de la connexion CodeStar GitHub (créée et approuvée manuellement
      au préalable dans la console AWS - voir README infra).
  DevMongoUriParam:
    Type: String
    Default: /todolist-api/dev/MONGODB_URI
    Description: Nom du paramètre SSM SecureString contenant l'URI MongoDB (dev)
  ProdMongoUriParam:
    Type: String
    Default: /todolist-api/prod/MONGODB_URI
    Description: Nom du paramètre SSM SecureString contenant l'URI MongoDB (prod)
  DeployRegion:
    Type: String
    Default: eu-west-3

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'todolist-api-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: todolist-api-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: todolist-api-codebuild-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Sid: ArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: SsmParams
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DevMongoUriParam}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ProdMongoUriParam}'
              - Sid: ServerlessDeploy
                Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - s3:*
                  - logs:*
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:GetRolePolicy
                Resource: '*'

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: todolist-api-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: todolist-api-codepipeline-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: ArtifactsBucketList
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: CodeStarConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt DeployDevProject.Arn
                  - !GetAtt DeployProdProject.Arn

  DeployDevProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: todolist-api-deploy-dev
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: STAGE
            Value: dev
          - Name: AWS_REGION_DEPLOY
            Value: !Ref DeployRegion
          - Name: MONGODB_URI
            Type: PARAMETER_STORE
            Value: !Ref DevMongoUriParam
          - Name: MONGODB_DB_NAME
            Value: todolist
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec-dev.yml

  DeployProdProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: todolist-api-deploy-prod
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: STAGE
            Value: prod
          - Name: AWS_REGION_DEPLOY
            Value: !Ref DeployRegion
          - Name: MONGODB_URI
            Type: PARAMETER_STORE
            Value: !Ref ProdMongoUriParam
          - Name: MONGODB_DB_NAME
            Value: todolist
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec-prod.yml

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: todolist-api-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
              OutputArtifacts:
                - Name: SourceOutput

        - Name: DeployDev
          Actions:
            - Name: DeployDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployDevProject
              InputArtifacts:
                - Name: SourceOutput

        - Name: ApproveProd
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: 'Valider le déploiement en production ?'

        - Name: DeployProd
          Actions:
            - Name: DeployProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployProdProject
              InputArtifacts:
                - Name: SourceOutput

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
